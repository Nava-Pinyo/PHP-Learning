version: '3.8'
services:
  app:
    image: phusitmlw/php-5.2-apache-mssql:1.1
    ports:
      - "8080:80"
    volumes:
      - "./conf/php.ini:/etc/php/apache2-php5.2/php.ini"
      - "./src/:/project/"
    networks:
      - mssql-network

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - mssql-network

volumes:
  mssql_data:

networks:
  mssql-network:
